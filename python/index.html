<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能时序预测平台</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">📈</span>
        <div>
            <h1>智能时序预测平台</h1>
            <p class="sub">FastAPI + 纯 Python 本地 ML（ARIMA / Holt-Winters）· 零外部 ML 依赖 · 离线可跑</p>
        </div>
    </div>
    <span class="badge" id="status-badge">后端连接中…</span>
</header>

<main class="layout">
    <!-- 左侧：输入与控制 -->
    <section class="panel">
        <h2>1. 数据输入</h2>
        <div class="row">
            <button class="ghost" data-sample="monthly_sales.csv">载入示例·月度销量</button>
            <button class="ghost" data-sample="hourly_traffic.csv">载入示例·小时流量</button>
        </div>
        <p class="hint">粘贴 CSV：程序会取<strong>每一行的最后一列</strong>作为数值；表头会被自动忽略。也支持纯数字（逗号/换行分隔）。</p>
        <textarea id="data" rows="9" placeholder="month,sales&#10;1,200.5&#10;2,210.3&#10;3,198.7&#10;..."></textarea>

        <h2>2. 模型配置</h2>
        <label class="field">
            <span>模型</span>
            <select id="model">
                <option value="auto">自动选择(auto)</option>
                <option value="arima">ARIMA</option>
                <option value="holt-winters">Holt-Winters(季节)</option>
            </select>
        </label>
        <div class="grid2">
            <label class="field"><span>预测步数 h</span><input id="horizon" type="number" value="12" min="1" max="60"></label>
            <label class="field"><span>季节周期 m</span><input id="m" type="number" value="12" min="2" max="60"></label>
        </div>
        <div class="grid3">
            <label class="field"><span>ARIMA p</span><input id="p" type="number" value="2" min="0" max="5"></label>
            <label class="field"><span>ARIMA d</span><input id="d" type="number" value="1" min="0" max="2"></label>
            <label class="field"><span>ARIMA q</span><input id="q" type="number" value="1" min="0" max="5"></label>
        </div>
        <label class="field">
            <span>季节类型</span>
            <select id="seasonal">
                <option value="additive">加性(additive)</option>
                <option value="multiplicative">乘性(multiplicative)</option>
            </select>
        </label>

        <div class="actions">
            <button id="run" class="primary">运行预测</button>
            <button id="runbt" class="secondary">滚动回测</button>
        </div>
        <p class="hint" id="msg">提示：先「载入示例」再「运行预测」。</p>
    </section>

    <!-- 右侧：结果 -->
    <section class="panel results">
        <h2>预测结果</h2>
        <div class="cards">
            <div class="card"><div class="k">选用模型</div><div class="v" id="m-model">-</div></div>
            <div class="card"><div class="k">MAPE</div><div class="v" id="m-mape">-</div></div>
            <div class="card"><div class="k">RMSE</div><div class="v" id="m-rmse">-</div></div>
            <div class="card"><div class="k">MAE</div><div class="v" id="m-mae">-</div></div>
        </div>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
        <h3>拟合参数</h3>
        <pre id="params" class="params">-</pre>

        <h3>滚动回测（逐步误差）</h3>
        <div id="bt" class="bt">点击「滚动回测」查看模型在不同预测步长下的误差。</div>
    </section>
</main>

<script src="vendor/chart.umd.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
